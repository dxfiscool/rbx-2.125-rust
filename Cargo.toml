[workspace]
members = ["crates/*", "xtask"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["dxf"]
license = "MIT"
repository = "https://github.com/dxfiscool/rbx-2.125-rust"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "1.0"
parking_lot = "0.12"
bitflags = "2.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
